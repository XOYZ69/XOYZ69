name: Profile

# Rebuilds the cards on the profile page (generated/) from live GitHub data and
# commits them when something changed. Pull requests are previewed by preview.yml.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "yoshida/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet "pillow>=10"

      - name: Install Yoshida
        run: bash .github/scripts/install_yoshida.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build cards
        run: python .github/scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated yoshida/cards
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(profile): refresh generated cards"
            git push
          fi
